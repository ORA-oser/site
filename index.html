<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ORA — Le voyage vers soi est une aventure</title>
<meta name="description" content="ORA — un programme de 12 semaines pour te retrouver, reprendre ta place et agir. Le voyage vers soi est une aventure."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Palanquin:wght@400;600&family=Tangerine:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{
  --creme:#f7f3ea; --vert:#003E1F; --vert-pomme:#DFF8E1;
  --teal:#3E9C8F; --noir:#161511;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Palanquin",system-ui,sans-serif;color:var(--noir);
  background:var(--creme);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px 20px;
}
.bird{width:150px;display:block;margin:0 auto 10px}
h1{
  font-family:"Gentium Plus",Georgia,serif;font-weight:400;
  font-size:clamp(2.6rem,7vw,4rem);letter-spacing:.02em;line-height:1;
}
.trait{display:block;width:170px;height:auto;margin:14px auto 18px}
.script{font-family:"Tangerine",cursive;font-size:clamp(2rem,5.5vw,2.9rem);color:var(--vert);line-height:1.1}
.intro{max-width:520px;margin:26px auto 0;font-size:1.06rem;line-height:1.7;color:#3c3a33}
.links{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
a.btn{
  display:inline-block;padding:14px 26px;border-radius:11px;text-decoration:none;
  font-size:1rem;font-weight:600;letter-spacing:.02em;
}
a.primary{background:var(--vert);color:#fff;border:1px solid var(--vert)}
a.primary:hover{background:#0a4a2a}
a.secondary{background:transparent;color:var(--vert);border:1px solid rgba(0,62,31,.35)}
a.secondary:hover{background:var(--vert-pomme)}
footer{margin-top:54px;font-size:.78rem;color:#7a766a;letter-spacing:.04em}
</style>
</head>
<body>

<img class="bird" src="colibri-hd.png" alt="Le colibri d'ORA"/>
<h1>ORA</h1>
<img class="trait" src="trait-mini-livre-sans-fond.png" alt=""/>
<p class="script">Le voyage vers soi est une aventure.</p>

<p class="intro">
Un programme de 12 semaines pour te retrouver, reprendre ta place
et expérimenter un premier changement — à ton rythme, sans culpabiliser.
</p>

<div class="links">
  <a class="btn primary" href="https://minilivre.ora-oser.fr">Recevoir le mini-livre gratuit</a>
  <a class="btn secondary" href="https://www.instagram.com/ora.oser">@ora.oser sur Instagram</a>
</div>

<footer>ORA — et si l'aventure commençait ici ?</footer>

</body>
</html>
